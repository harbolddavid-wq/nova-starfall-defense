plugins { id 'com.android.application' }
android {
  namespace 'com.novasky.moonbeam'
  compileSdk 36
  defaultConfig {
    applicationId 'com.novasky.moonbeam'
    minSdk 30
    targetSdk 35
    versionCode 2
    versionName '0.1.1'
  }
  buildTypes { debug { applicationIdSuffix '.repair' } release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
