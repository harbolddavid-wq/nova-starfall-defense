plugins { id 'com.android.application' }
android {
    namespace 'com.novasky.arcade'
    compileSdk 36
    defaultConfig {
        // A separate test install protects the working original and its data.
        applicationId 'com.novasky.velvetfling.afterhours.test'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2-bloom-fix'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
