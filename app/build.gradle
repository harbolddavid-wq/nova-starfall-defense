plugins { id 'com.android.application' }
android {
 namespace 'com.novasky.holodeck'
 compileSdk 36
 defaultConfig {
  applicationId 'com.novasky.holodeck'
  minSdk 26
  targetSdk 36
  versionCode 2
  versionName '0.1.1'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs { debug { if(rootProject.file('.signing/candidate.keystore').exists()) { storeFile rootProject.file('.signing/candidate.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:rules:1.6.1'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
