<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090e22"><title>Nova Fireflies</title>
<style>
:root{color-scheme:dark;--accent:#f8df9a;--text:#f8f3ea;--muted:#b3b5cb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;color:var(--text);font-family:system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 28px) 24px 0;pointer-events:none;text-align:center;text-shadow:0 2px 22px #040716}
.eyebrow{font-size:10px;letter-spacing:.38em;color:#d4c8f1;text-transform:uppercase}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.07em;font-size:clamp(34px,9vw,48px);margin:6px 0 2px}#subtitle{font-family:Georgia,serif;font-style:italic;color:#d2cde0;font-size:14px;opacity:.86}
#panel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:16px;right:16px;max-width:520px;margin:auto;padding:17px 18px 15px;border:1px solid #e3d5ff30;border-radius:25px;background:linear-gradient(155deg,#111831e6,#181529d9);box-shadow:0 15px 60px #0008, inset 0 1px #fff1;backdrop-filter:blur(20px)}
#tip{font-size:12px;color:#c7c5d7;text-align:center;margin-bottom:14px;letter-spacing:.02em}
#themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit;cursor:pointer;color:#ece7f6} .theme{padding:10px 4px 9px;border:1px solid #a5a1c04d;border-radius:14px;background:#ffffff09;font-size:12px;transition:background .18s,border-color .18s,transform .18s}.theme.active{border-color:#e4d0fc;background:#b99be329;box-shadow:0 0 22px #a884ff21}.theme:active{transform:scale(.95)}.swatch{display:block;width:20px;height:20px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 14px currentColor}.theme:nth-child(1) .swatch{background:#f4d580;color:#f4d580}.theme:nth-child(2) .swatch{background:#91e6e1;color:#91e6e1}.theme:nth-child(3) .swatch{background:#ed9cda;color:#ed9cda}
#bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px;gap:10px}#hint{font-size:11px;color:#a6a8bd}#sound{border:1px solid #b5b0d34d;border-radius:24px;background:#ffffff10;padding:9px 13px;font-size:12px;min-width:108px}#sound:active{background:#fff2}#status{position:fixed;top:calc(env(safe-area-inset-top) + 128px);left:0;right:0;text-align:center;pointer-events:none;font-family:Georgia,serif;font-style:italic;color:#f6dfab;opacity:0;transition:opacity .3s;text-shadow:0 0 16px #fff8}#status.show{opacity:1}
@media(max-height:610px){#top{padding-top:12px}h1{font-size:30px}#panel{padding:10px 12px;bottom:8px}#tip{margin-bottom:7px}#status{top:90px}}
</style></head><body><canvas id="world" aria-label="Interactive moonlit forest with fireflies"></canvas>
<div id="top"><div class="eyebrow">a pocket of quiet magic</div><h1>Nova Fireflies</h1><div id="subtitle">A little light follows you home</div></div><div id="status" aria-live="polite">A wish has taken flight ✨</div>
<div id="panel"><div id="tip">✦ Touch to make a wish · Drag to lead the lights ✦</div><div id="themes">
<button class="theme" data-theme="0"><span class="swatch"></span>Moonlit Gold</button>
<button class="theme" data-theme="1"><span class="swatch"></span>Blue Reverie</button>
<button class="theme" data-theme="2"><span class="swatch"></span>Rose Twilight</button>
</div><div id="bottom"><span id="hint">Offline · No ads · Just a little wonder</span><button id="sound" aria-pressed="false">♫ Sound off</button></div></div>
<script>
"use strict";
const canvas=document.getElementById("world"),ctx=canvas.getContext("2d",{alpha:false});
const themes=[
{sky:["#080d25","#1b2547","#24364b"],moon:"#f4edcf",glow:[249,214,122],hill:"#0d2431",trees:"#081521",leaf:"#153a3d",label:"Moonlit Gold"},
{sky:["#071523","#102e43","#145060"],moon:"#c6f3f0",glow:[111,239,228],hill:"#0b3139",trees:"#061d29",leaf:"#13555a",label:"Blue Reverie"},
{sky:["#1c1028","#412342","#624358"],moon:"#ffe1e8",glow:[255,167,217],hill:"#30243c",trees:"#1b1429",leaf:"#54304c",label:"Rose Twilight"}
];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let W=1,H=1,dpr=1,theme=0,muted=false,fireflies=[],sparks=[],stars=[],touch=null,last=0,time=0,audio=null,lastChime=0,noticeUntil=0;
try{theme=clamp(parseInt(localStorage.getItem("novaFirefliesTheme")||"0",10)||0,0,2);muted=localStorage.getItem("novaFirefliesMuted")==="true"}catch(_){}
function save(){try{localStorage.setItem("novaFirefliesTheme",String(theme));localStorage.setItem("novaFirefliesMuted",String(muted))}catch(_){}}
function rgba(rgb,a){return "rgba("+rgb.join(",")+","+a+")"}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(110,Math.round(W*H/5500))},()=>({x:Math.random()*W,y:Math.random()*H*.68,r:rand(.35,1.4),phase:rand(0,6.3)}));if(!fireflies.length)fireflies=Array.from({length:Math.min(90,Math.round(W*H/7800)+24)},()=>({x:rand(0,W),y:rand(H*.2,H*.86),vx:rand(-12,12),vy:rand(-9,9),r:rand(1.2,2.9),phase:rand(0,6.28),drift:rand(.3,1.1)}));}
window.addEventListener("resize",resize);resize();
function drawTree(x,y,scale,lean,foreground=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.rotate(lean);ctx.strokeStyle=foreground?themes[theme].trees:"#142c39";ctx.lineCap="round";ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(0,20);ctx.quadraticCurveTo(-5,-105,4,-245);ctx.stroke();ctx.lineWidth=7;for(let i=0;i<7;i++){let yy=-65-i*27,dir=i%2?1:-1;ctx.beginPath();ctx.moveTo(0,yy);ctx.quadraticCurveTo(dir*36,yy-25,dir*(52+i*5),yy-49);ctx.stroke()}ctx.fillStyle=foreground?themes[theme].leaf:"#173544";for(let i=0;i<24;i++){let a=i*2.399,r=rand(15,79);ctx.beginPath();ctx.ellipse(Math.cos(a)*r,-208+Math.sin(a)*r*.55,rand(17,37),rand(13,29),a,0,Math.PI*2);ctx.fill()}ctx.restore()}
function background(t){const p=themes[theme];let g=ctx.createLinearGradient(0,0,0,H);p.sky.forEach((c,i)=>g.addColorStop(i/2,c));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
let mx=W*.74,my=H*.22,mr=Math.min(W*.115,49);g=ctx.createRadialGradient(mx,my,4,mx,my,mr*4.2);g.addColorStop(0,"#fff6d433");g.addColorStop(.35,"#fff1c513");g.addColorStop(1,"#fff1c500");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=p.moon;ctx.shadowColor=p.moon;ctx.shadowBlur=23;ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
for(const s of stars){ctx.fillStyle="rgba(240,236,255,"+(.17+.34*(.5+.5*Math.sin(t*.7+s.phase)))+")";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}
ctx.fillStyle=p.hill;ctx.beginPath();ctx.moveTo(0,H*.78);ctx.quadraticCurveTo(W*.25,H*.65,W*.56,H*.77);ctx.quadraticCurveTo(W*.81,H*.65,W,H*.71);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
drawTree(W*.06,H*.81,.76,-.09);drawTree(W*.93,H*.83,.85,.11);drawTree(W*.35,H*.82,.36,.02,false);
ctx.fillStyle=p.trees;ctx.beginPath();ctx.moveTo(0,H*.92);ctx.quadraticCurveTo(W*.34,H*.87,W*.62,H*.94);ctx.quadraticCurveTo(W*.82,H*.89,W,H*.91);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
for(let i=0;i<14;i++){let x=(i*79.31)%W,y=H*.9+Math.sin(i*4.3)*10;ctx.strokeStyle="#356a5366";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,H);ctx.quadraticCurveTo(x+Math.sin(i)*14,y-17,x+Math.cos(i*5)*18,y-30);ctx.stroke()}
}
function glow(x,y,r,a){const c=themes[theme].glow;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,a));g.addColorStop(.17,rgba(c,a*.65));g.addColorStop(.55,rgba(c,a*.11));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function spawn(x,y,n=23){const c=themes[theme].glow;for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(20,140);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,life:rand(.7,1.5),max:1.5,r:rand(1.5,4)})}for(const f of fireflies){let dx=f.x-x,dy=f.y-y;if(dx*dx+dy*dy<140*140){f.vx+=dx*.16;f.vy+=dy*.16}}if(!muted)chime();const s=document.getElementById("status");s.classList.add("show");noticeUntil=performance.now()+1050;}
function chime(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const now=audio.currentTime;if(now-lastChime<.11)return;lastChime=now;[659.25,987.77,1318.5].forEach((freq,i)=>{const o=audio.createOscillator(),gain=audio.createGain();o.type="sine";o.frequency.setValueAtTime(freq,now+i*.08);gain.gain.setValueAtTime(.0001,now+i*.08);gain.gain.exponentialRampToValueAtTime(.035/(i+1),now+i*.08+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.08+.8);o.connect(gain).connect(audio.destination);o.start(now+i*.08);o.stop(now+i*.08+.85)})}catch(_){}}
function tick(now){if(document.hidden){last=now;requestAnimationFrame(tick);return}const dt=Math.min((now-last)/1000||.016,.045);last=now;time+=dt;background(time);
for(const f of fireflies){f.phase+=dt*f.drift*2;let tx=Math.sin(f.phase*.7)*8,ty=Math.cos(f.phase*.9)*6;if(touch){let dx=touch.x-f.x,dy=touch.y-f.y,dist=Math.hypot(dx,dy);if(dist<250){tx+=dx*.45;ty+=dy*.45}}f.vx+=(tx-f.vx)*dt*1.3;f.vy+=(ty-f.vy)*dt*1.3;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.x<-20)f.x=W+20;if(f.x>W+20)f.x=-20;if(f.y<H*.12)f.vy+=25*dt;if(f.y>H*.88)f.vy-=28*dt;let a=.45+.34*Math.sin(f.phase*2.1);glow(f.x,f.y,f.r*10,a*.52);ctx.fillStyle=rgba(themes[theme].glow,Math.max(.3,a));ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}
for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*1.9);p.vy+=12*dt;glow(p.x,p.y,p.r*7,p.life/p.max*.62);ctx.fillStyle=rgba(themes[theme].glow,p.life/p.max);ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.35+.65*p.life/p.max),0,6.283);ctx.fill()}
if(now>noticeUntil)document.getElementById("status").classList.remove("show");requestAnimationFrame(tick)}
function coords(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();touch=coords(e);touch.id=e.pointerId;spawn(touch.x,touch.y,26);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener("pointermove",e=>{if(touch&&e.pointerId===touch.id){e.preventDefault();let p=coords(e);touch.x=p.x;touch.y=p.y;if(Math.random()<.45)sparks.push({x:p.x+rand(-9,9),y:p.y+rand(-9,9),vx:rand(-14,14),vy:rand(-26,-4),life:rand(.35,.75),max:.75,r:rand(1,2.2)})}});
for(const event of ["pointerup","pointercancel","lostpointercapture"])canvas.addEventListener(event,e=>{if(touch&&touch.id===e.pointerId)touch=null});
function updateUI(){document.querySelectorAll(".theme").forEach(b=>{const active=Number(b.dataset.theme)===theme;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});document.getElementById("sound").textContent=muted?"♫ Sound off":"♫ Sound on";document.getElementById("sound").setAttribute("aria-pressed",String(!muted))}
document.querySelectorAll(".theme").forEach(b=>b.addEventListener("click",()=>{theme=Number(b.dataset.theme);save();updateUI();spawn(W*.5,H*.55,44)}));
document.getElementById("sound").addEventListener("click",()=>{muted=!muted;save();updateUI();if(!muted)chime()});updateUI();requestAnimationFrame(tick);
</script></body></html>
