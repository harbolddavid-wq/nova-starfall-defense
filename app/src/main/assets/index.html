<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Nova: Starfall Defense</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;background:#050817;color:#f8f3ff;font-family:system-ui,sans-serif;user-select:none}#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;background:radial-gradient(ellipse at center,#20204c,#060816 74%)}#top{display:flex;justify-content:space-between;align-items:center;width:min(100%,530px)}h1{font-size:clamp(17px,4vw,24px);color:#ffd879;letter-spacing:2px;margin:5px 0}#sound{background:transparent;border:0;box-shadow:none;font-size:12px}#hud{width:min(100%,530px);display:flex;justify-content:space-between;font-size:14px;color:#d8d4ed}#hud b{color:white}#frame{width:min(100%,530px);flex:1;min-height:180px;position:relative;border:2px solid #8570c4;border-radius:13px;overflow:hidden;box-shadow:0 0 25px #664de355;background:#060a21}canvas{width:100%;height:100%;display:block}#panel{position:absolute;inset:0;background:#080d27e8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:18px}#panel.hidden{display:none}#panel h2{color:#ffd879;font-size:clamp(26px,8vw,43px);line-height:1.04;margin:0;text-shadow:0 0 18px #eb8795aa}#panel p{max-width:330px;color:#e1dcfa;font-size:14px;line-height:1.5}button{border-radius:12px;color:white;font:inherit;font-weight:900;background:linear-gradient(140deg,#6551ad,#332c72);border:1px solid #b5a1f2;box-shadow:0 4px 12px #0009}button:active,.pressed{background:#ab70eb}#start{padding:13px 24px;font-size:20px;color:#fff2c6;border-color:#ffd879}#controls{display:flex;justify-content:space-between;width:min(100%,530px);gap:12px;height:clamp(68px,12vh,92px)}#moves{display:flex;gap:12px}.control{width:clamp(68px,20vw,98px);font-size:30px}.fire{width:clamp(110px,32vw,150px);background:linear-gradient(140deg,#af5b86,#662c6e);border-color:#fa8fba}footer{font-size:10px;letter-spacing:1px;color:#b6a7dd;text-align:center}
</style></head><body><div id="wrap">
<div id="top"><h1>NOVA ★ STARFALL</h1><button id="sound">🔊 SOUND</button></div>
<div id="hud"><span>SCORE <b id="score">00000</b></span><span>WAVE <b id="wave">1</b> &nbsp; LIVES <b id="lives">♥♥♥</b></span></div>
<div id="frame"><canvas id="game"></canvas><div id="panel"><h2>STARFALL<br>DEFENSE</h2><p>Defend the stars! Dodge enemy fire, clear waves, and beat your high score.</p><button id="start">START GAME</button><p>◀ ▶ Move · FIRE Shoot</p></div></div>
<div id="controls"><div id="moves"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control fire" id="fire">● FIRE</button></div><footer>ORIGINAL ARCADE GAME · OFFLINE · NO ADS</footer>
</div><script>
(()=>{"use strict";const el=id=>document.getElementById(id),canvas=el("game"),ctx=canvas.getContext("2d"),frame=el("frame");let W=400,H=600,playing=false,score=0,wave=1,lives=3,time=0,old=0,lastShot=0,dir=1,speed=35,enemyClock=0,invuln=0,ship=200,aliens=[],shots=[],enemyShots=[],particles=[],stars=[],controls={left:false,right:false,fire:false},muted=false,audio;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(x,b));
function tone(hz=440,d=.1,kind="square"){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.value=hz;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resize(){W=frame.clientWidth;H=frame.clientHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);ship=W/2;stars=Array.from({length:85},()=>({x:rand(0,W),y:rand(0,H),r:rand(.5,2),a:rand(.25,.8)}));draw()}
function hud(){el("score").textContent=String(score).padStart(5,"0");el("wave").textContent=wave;el("lives").textContent="♥".repeat(lives)}
function newWave(){aliens=[];dir=1;speed=26+wave*9;enemyClock=.7;let cols=7,rows=Math.min(5,2+Math.floor((wave+1)/2)),gap=Math.min(50,(W-36)/cols);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)aliens.push({x:W/2+(c-3)*gap,y:48+r*37,row:r,color:["#73e8ff","#ffd879","#f68eae","#c3a2ff","#ffab72"][r%5]});tone(360,.14,"triangle")}
function start(){score=0;wave=1;lives=3;time=0;lastShot=-1;invuln=0;ship=W/2;shots=[];enemyShots=[];particles=[];playing=true;newWave();hud();el("panel").classList.add("hidden");old=performance.now();requestAnimationFrame(loop)}
function end(){playing=false;el("panel").classList.remove("hidden");el("panel").querySelector("h2").innerHTML="GAME<br>OVER";let best=score;try{best=Math.max(score,+(localStorage.starfallBest||0));localStorage.starfallBest=best}catch(e){}el("panel").querySelector("p").textContent="Score "+score+" · Best "+best+" — the galaxy needs you again!";el("start").textContent="PLAY AGAIN";tone(150,.4,"sawtooth")}
function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:rand(-125,125),vy:rand(-145,120),life:rand(.3,.65),color})}
function fire(){if(time-lastShot<.18)return;lastShot=time;shots.push({x:ship,y:H-61});tone(630,.065)}
function draw(){ctx.fillStyle="#060a21";ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle="rgba(182,215,255,"+s.a+")";ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.fillStyle="#9271df44";ctx.fillRect(0,H-15,W,1);for(const a of aliens){ctx.fillStyle=a.color;const bits=["00111100","01111110","11111111","11011011","11111111","00100100","01011010","10000001"];for(let j=0;j<8;j++)for(let i=0;i<8;i++)if(bits[j][i]==="1")ctx.fillRect(a.x+(i-4)*3,a.y+(j-4)*3,3,3)}ctx.save();if(invuln>0&&Math.floor(time*10)%2===0)ctx.globalAlpha=.25;ctx.translate(ship,H-43);ctx.fillStyle="#73e8ff";ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(9,-3);ctx.lineTo(18,7);ctx.lineTo(18,12);ctx.lineTo(-18,12);ctx.lineTo(-18,7);ctx.lineTo(-9,-3);ctx.closePath();ctx.fill();ctx.fillStyle="#e4aaff";ctx.fillRect(-5,-6,10,15);ctx.fillStyle="#ffd879";ctx.fillRect(-12,12,6,6);ctx.fillRect(6,12,6,6);ctx.restore();ctx.fillStyle="#ffe3a0";for(const s of shots)ctx.fillRect(s.x-2,s.y-12,4,14);ctx.fillStyle="#ff739d";for(const s of enemyShots)ctx.fillRect(s.x-3,s.y,6,13);for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1}
function loop(now){if(!playing)return;let dt=Math.min((now-old)/1000,.05);old=now;time+=dt;invuln=Math.max(0,invuln-dt);ship=clamp(ship+((controls.right?1:0)-(controls.left?1:0))*280*dt,20,W-20);if(controls.fire)fire();for(const s of stars){s.y+=dt*(8+s.r*12);if(s.y>H){s.y=0;s.x=rand(0,W)}}let left=Infinity,right=-Infinity,bottom=0;for(const a of aliens){left=Math.min(left,a.x);right=Math.max(right,a.x);bottom=Math.max(bottom,a.y)}if(right>W-22&&dir>0||left<22&&dir<0){dir=-dir;for(const a of aliens)a.y+=13}for(const a of aliens)a.x+=dir*speed*dt;if(bottom>=H-70){end();draw();return}enemyClock-=dt;if(enemyClock<=0){if(aliens.length){let a=aliens[Math.floor(Math.random()*aliens.length)];enemyShots.push({x:a.x,y:a.y+15})}enemyClock=rand(.45,1.15)/Math.sqrt(wave*.23+1)}for(const s of shots)s.y-=530*dt;for(const s of enemyShots)s.y+=(125+wave*19)*dt;shots=shots.filter(s=>s.y>-20);enemyShots=enemyShots.filter(s=>s.y<H+20);for(let i=shots.length-1;i>=0;i--){const s=shots[i],hit=aliens.findIndex(a=>Math.abs(a.x-s.x)<16&&Math.abs(a.y-s.y)<15);if(hit>=0){let a=aliens.splice(hit,1)[0];shots.splice(i,1);score+=10*(5-a.row)+wave*2;burst(a.x,a.y,a.color);tone(350+a.row*65,.08,"triangle");hud()}}for(let i=enemyShots.length-1;i>=0;i--){const s=enemyShots[i];if(invuln===0&&Math.abs(s.x-ship)<18&&Math.abs(s.y-(H-43))<18){enemyShots.splice(i,1);lives--;invuln=1.35;burst(ship,H-43,"#73e8ff");tone(160,.25,"sawtooth");hud();if(lives===0){end();draw();return}}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(aliens.length===0){wave++;score+=100;shots=[];enemyShots=[];newWave();hud()}draw();requestAnimationFrame(loop)}
function bind(id,key){let b=el(id);b.addEventListener("pointerdown",e=>{e.preventDefault();controls[key]=true;b.classList.add("pressed");try{b.setPointerCapture(e.pointerId)}catch(_){} });for(const name of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(name,()=>{controls[key]=false;b.classList.remove("pressed")})}
bind("left","left");bind("right","right");bind("fire","fire");addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","Space","KeyA","KeyD"].includes(e.code))e.preventDefault();if(e.code==="ArrowLeft"||e.code==="KeyA")controls.left=true;if(e.code==="ArrowRight"||e.code==="KeyD")controls.right=true;if(e.code==="Space")controls.fire=true});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")controls.left=false;if(e.code==="ArrowRight"||e.code==="KeyD")controls.right=false;if(e.code==="Space")controls.fire=false});el("sound").addEventListener("click",()=>{muted=!muted;el("sound").textContent=muted?"🔇 MUTED":"🔊 SOUND"});el("start").addEventListener("click",start);addEventListener("resize",resize);resize();hud();
})();
</script></body></html>
