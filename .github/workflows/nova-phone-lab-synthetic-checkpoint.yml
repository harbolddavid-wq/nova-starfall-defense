name: Nova Phone Lab - Synthetic Snapshot Restart Proof
on:
  push:
    branches: [experiment/nova-phone-lab-live-2026-11-01]
    paths: ['tools/phone_lab_checkpoint/trigger.txt']
permissions:
  contents: read
jobs:
  synthetic-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore synthetic fixture
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: lab-fixture/app/build/outputs/apk/debug/app-debug.apk
          key: nova-lab-button-apk-${{ hashFiles('lab-fixture/**') }}-v1
      - name: Build synthetic fixture if needed
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: gradle --no-daemon -p lab-fixture :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore synthetic Android 16 base
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nova-phone-lab-avd-api36-googleapis-x64-v1
      - name: Set test state and save checkpoint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install -r lab-fixture/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.novasky.phonelab.fixture/.MainActivity
            sleep 3
            adb shell input tap 350 430
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 1'
            adb emu avd snapshot save nova_checkpoint | tee /tmp/nova-checkpoint.txt
            grep -q '^OK' /tmp/nova-checkpoint.txt
      - name: Restart emulator and restore checkpoint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -snapshot nova_checkpoint -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 1'
            adb shell input tap 350 430
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 2'
            echo 'PASS: synthetic app state survived emulator restart on same disposable runner.'
