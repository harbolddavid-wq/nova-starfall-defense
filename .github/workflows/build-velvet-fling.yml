name: Build Velvet Fling APK
on:
  push:
    branches:
      - feature/velvet-fling-2026
      - work/velvet-after-hours-2026-10-28
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check gameplay geometry and control flows
        run: |
          node tests/physics.test.js
          node tests/game-flow.test.js
          node tests/audio-lifecycle.test.js
          node tests/music-scores.test.js
          node tests/character-sounds.test.js
          node tests/pause-regression.test.js
          node tests/bloom-impact.test.js
          node tests/power-uses.test.js
          node tests/campaign.test.js
          node tests/campaign-playthrough.test.js
          node tests/rival-campaign.test.js
          node tests/rival-playthrough.test.js
          node tests/encore-playthrough.test.js
          node tests/first-level-compat.test.js
          node tools/find_campaign_solutions.js
      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Velvet-After-Hours-Nights-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
