name: Nova Phone Lab - Synthetic App Save and Resume
on:
  push:
    branches: [experiment/nova-phone-lab-live-2026-11-01]
    paths: ['.github/workflows/nova-phone-lab-app-save-proof.yml']
permissions:
  contents: read
jobs:
  save-synthetic-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build synthetic debuggable APK
        run: gradle --no-daemon -p lab-fixture :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Save synthetic counter after two taps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install lab-fixture/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.novasky.phonelab.fixture/.MainActivity
            sleep 3
            adb shell input tap 350 430
            adb shell input tap 350 430
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 2'
            adb shell am force-stop com.novasky.phonelab.fixture
            mkdir -p "$RUNNER_TEMP/nova-save"
            adb exec-out run-as com.novasky.phonelab.fixture tar -C /data/user/0/com.novasky.phonelab.fixture -cf - shared_prefs > "$RUNNER_TEMP/nova-save/save.tar"
            test -s "$RUNNER_TEMP/nova-save/save.tar"
            cp lab-fixture/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/nova-save/fixture.apk"
            cd "$RUNNER_TEMP/nova-save" && sha256sum save.tar fixture.apk > SHA256SUMS && wc -c save.tar
      - name: Upload synthetic-only test data for one day
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-app-save-${{ github.run_id }}
          path: ${{ runner.temp }}/nova-save/
          retention-days: 1
          if-no-files-found: error
  restore-on-fresh-runner:
    needs: save-synthetic-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-app-save-${{ github.run_id }}
          path: ${{ runner.temp }}/nova-save
      - name: Verify transfer
        run: cd "$RUNNER_TEMP/nova-save" && sha256sum -c SHA256SUMS
      - name: Restore on a fresh Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install "$RUNNER_TEMP/nova-save/fixture.apk"
            adb shell run-as com.novasky.phonelab.fixture tar -C /data/user/0/com.novasky.phonelab.fixture -xf - < "$RUNNER_TEMP/nova-save/save.tar"
            adb shell am start -n com.novasky.phonelab.fixture/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 2'
            adb shell input tap 350 430
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 3'
            echo 'PASS synthetic counter restored to 2 on a fresh runner and advanced to 3.'
