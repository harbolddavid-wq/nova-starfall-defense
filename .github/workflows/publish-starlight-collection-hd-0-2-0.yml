name: Publish Starlight Collection HD 0.2.0
on:
  push:
    branches: [work/starlight-collection-hd-0.2.0-release]
    paths: ['.github/workflows/publish-starlight-collection-hd-0-2-0.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and publish the approved signed Android build
        shell: bash
        run: |
          set -euo pipefail
          file='Starlight-Collection-HD-0.2.0-Remake.apk'
          tag='starlight-collection-hd-v0.2.0'
          expected='e5fd28614e524c8939858add2c392159171826c807dde4dbaf70d6f185c44b67'
          urls=(
            'https://hatchable.com/s/eyJwIjoxMjc3OTIsImsiOiJ0bXBcL3N0YXJsaWdodC1oZC1lNWZkMjg2MVwvMCJ9.5c388e8eecf2f2117060da95ee55749683ded1a46914f577557ad03ef0ac2767'
