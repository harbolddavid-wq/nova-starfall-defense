name: Nova Phone Lab — Android 16 BLU-like APK test

on:
  push:
    branches:
      - work/velvet-after-hours-2026-10-28
    paths:
      - '.github/workflows/nova-phone-lab-android16.yml'
      - 'tools/android16_smoke_test.sh'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-phone-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-lab:
    name: API 36 / 720x1600 / 4 GB AVD
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run existing non-device game regressions
        run: |
          node tests/physics.test.js
          node tests/game-flow.test.js
          node tests/audio-lifecycle.test.js
          node tests/pause-regression.test.js

      - name: Build isolated Velvet Fling test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 16 and install / exercise APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android16_smoke_test.sh

      - name: Save screenshots and crash / device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Phone-Lab-Android16-Evidence
          path: phone-lab-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Save built test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Phone-Lab-Android16-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
