name: Nova Phone Lab — Android 16 BLU-like APK test

on:
  push:
    branches:
      - work/velvet-after-hours-2026-10-28
    paths:
      - '.github/workflows/nova-phone-lab-android16.yml'
      - 'tools/android16_smoke_test.sh'
      - 'tools/verify_phone_lab_screen.py'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-phone-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-lab:
    name: API 36 / 720x1600 / 4 GB AVD
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run existing non-device game regressions
        run: |
          node tests/physics.test.js
          node tests/game-flow.test.js
          node tests/audio-lifecycle.test.js
          node tests/music-scores.test.js
          node tests/character-sounds.test.js
          node tests/pause-regression.test.js
          node tests/bloom-impact.test.js
          node tests/power-uses.test.js
          node tests/campaign.test.js
          node tests/campaign-playthrough.test.js
          node tests/rival-campaign.test.js
          node tests/rival-playthrough.test.js
          node tests/first-level-compat.test.js
          node tools/find_campaign_solutions.js

      - name: Build isolated Velvet Fling test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build disposable emulator-only chapter fixture
        run: |
          mkdir -p phone-lab-variants
          cp app/build/outputs/apk/debug/app-debug.apk phone-lab-variants/real-app.apk
          cp app/src/main/assets/velvet.html phone-lab-variants/velvet-original.html
          trap 'cp phone-lab-variants/velvet-original.html app/src/main/assets/velvet.html; cp phone-lab-variants/real-app.apk app/build/outputs/apk/debug/app-debug.apk' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/velvet.html')
          html = p.read_text()
          hook = "<script>try{localStorage.setItem('velvet_ah_unlocked','10');localStorage.setItem('velvet_ah_stars',JSON.stringify({9:1}));localStorage.setItem('velvet_ah_campaign_v1','1')}catch(e){}</script>"
          marker = '<script src="velvet-play.js"></script>'
          assert html.count(marker) == 1
          p.write_text(html.replace(marker, hook + marker))
          PY
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk phone-lab-variants/seeded-night-10.apk

      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 16 and install / exercise APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android16_smoke_test.sh

      - name: Save screenshots and crash / device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Phone-Lab-Android16-Evidence
          path: phone-lab-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Save built test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Phone-Lab-Android16-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
