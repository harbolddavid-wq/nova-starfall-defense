name: Build Nova Family Store Portal
on:
  push:
    branches: [nova-family-store-launcher]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build standalone native Android launcher
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and prepare release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Nova_Family_Store_Portal_1.0.0.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose Nova_Family_Store_Portal_1.0.0.apk
          sha256sum Nova_Family_Store_Portal_1.0.0.apk
      - name: Publish public downloadable launcher APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nova-family-store-portal-v1.0.0 Nova_Family_Store_Portal_1.0.0.apk --target "$GITHUB_SHA" --title "Nova Family Store Portal 1.0.0" --notes "Original lightweight Android launcher for https://nova-family-store.hatchable.site . Opens the store in the phone's normal browser so APK downloads work. Separate package from the original Store app. This first public build is debug-signed; a future launcher update requires the same signing key or a new install." || {
            gh release upload nova-family-store-portal-v1.0.0 Nova_Family_Store_Portal_1.0.0.apk --clobber
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Family-Store-Portal-v1
          path: Nova_Family_Store_Portal_1.0.0.apk
          retention-days: 3
