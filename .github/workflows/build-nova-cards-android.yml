name: Build Nova Card Collection Android APK
on:
  push:
    branches:
      - nova-card-collection-build
    paths:
      - 'nova-cards-android/**'
      - '.github/workflows/build-nova-cards-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK packages on hosted runner
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager missing"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile offline Android app
        run: gradle -p nova-cards-android :app:assembleDebug --no-daemon
      - name: Upload install-test APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-card-collection-debug-apk
          path: nova-cards-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
