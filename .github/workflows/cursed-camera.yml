name: Cursed Camera bundled face effects
on:
  push:
    branches: [work/cursed-camera-first-booth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore source
        run: |
          mkdir work
          base64 -d midnight-booth/source.b64 > work/source.zip
          echo '0e5b3dbc18c1ca84c5be3bdadd3dc0ba8381c8967dfd06900044b4989c42b358  work/source.zip' | sha256sum -c -
          cd work && unzip -q source.zip
      - name: Build with bundled offline face detection
        run: |
          cd work
          gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true :app:assembleRelease
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/midnight-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions output/midnight-unsigned.apk > output/permissions.txt
          if grep -q 'android.permission.INTERNET' output/permissions.txt; then echo 'Unexpected internet permission' >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-booth-unsigned
          path: work/output/*
          retention-days: 7

      - name: Build emulator test app
        run: |
          mkdir -p work/app/src/debug/assets
          curl -fsSL https://raw.githubusercontent.com/googlesamples/mlkit/master/ios/quickstarts/vision/Resources/grace_hopper.jpg -o work/app/src/debug/assets/ci_portrait.jpg
          cd work && gradle --no-daemon -Pandroid.useAndroidX=true :app:assembleDebug
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install work/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.novasky.midnightbooth/.BoothActivity
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml work/output/window.xml
            grep -q 'CURSED CAMERA' work/output/window.xml
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png work/output/screen.png
            adb logcat -c
            adb shell am start -W -n com.novasky.midnightbooth/.SceneSmokeActivity
            for attempt in $(seq 1 60); do adb logcat -d -s CursedSceneSmoke:I '*:S' > work/output/scene-log.txt; if grep -q SCENE_SMOKE_SUCCESS work/output/scene-log.txt; then break; fi; if grep -q SCENE_SMOKE_FAILED work/output/scene-log.txt; then cat work/output/scene-log.txt; exit 1; fi; sleep 2; done
            grep -q SCENE_SMOKE_SUCCESS work/output/scene-log.txt
            adb exec-out run-as com.novasky.midnightbooth cat files/scene-smoke.png > work/output/scene-smoke.png
            test -s work/output/scene-smoke.png
            adb exec-out run-as com.novasky.midnightbooth cat files/face-smoke.png > work/output/face-smoke.png
            test -s work/output/face-smoke.png
            adb logcat -d -t 1500 > work/output/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursed-scene-android16-smoke
          path: work/output/*
          retention-days: 7
