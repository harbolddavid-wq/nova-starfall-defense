name: Verify published world on installed Holodeck — no new host APK
on:
  push:
    branches: [work/pocket-holodeck]
    paths: ['delivery/publisher-proof.json']
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache/restore@v4
        with:
          path: .signing/candidate.keystore
          key: pocket-holodeck-candidate-signer-v2
          fail-on-cache-miss: true
      - name: Build only the instrumentation test APK
        run: |
          cp publisher-device-tests/PortalBloomTest.java app/src/androidTest/java/com/novasky/holodeck/
          gradle --no-daemon :app:assembleDebugAndroidTest
          mkdir -p evidence
          curl -fsSL https://github.com/harbolddavid-wq/nova-starfall-defense/releases/download/holodeck-v0.2.0/Nova_Pocket_Holodeck_v0.2.0.apk -o /tmp/existing-host.apk
          echo '75b3a0a042c2a66117f57ebc0ac76c920e27b51815e18e04782ba29186f41970  /tmp/existing-host.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download and play live published world on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash publisher-device-tests/device-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Holodeck-Publisher-Device-Proof
          path: evidence/
          retention-days: 14
