name: Publish Noa's Starlight Wild Table 1.8.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-noa-wildtable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'harbolddavid-wq/nova-starfall-defense'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve and verify the exact eight original APK pieces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts release
          base='https://nova-family-store.hatchable.site/api/wildtable-transfer'
          for i in $(seq -w 1 8); do
            number=$((10#$i))
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --connect-timeout 25 --max-time 180 \\
              -o "parts/part$i.bin" "$base?part=$number"
          done
          sha256sum --check <<'EXPECTED'
          33843e98f6f8669cee103773897a3e3f83928ba26c5d86f09de67b9c63d1df80  parts/part01.bin
          bd2d7c038a7f830d978672cdc2067530d4601c3b4846c339f3c2ec1c450ae38b  parts/part02.bin
          a0dffe61523132281901875d4b4863948cfb2ab916653e2d981710bf1a2350ff  parts/part03.bin
          a78a8b226137329c78f8e66382ed8b9996efa2402899b093b605fc3258c2269c  parts/part04.bin
          bec2da7283922699b49d2e55fc15a0f2390a4a43a7ebcedb0aa1600559635752  parts/part05.bin
          f4878e2b19005e802c74c4ff1648d9048dad3805d4b351f32ce31030165bf2a9  parts/part06.bin
          fe028adf192d5a14b5cd8341d07254a9069cb1692d075a385b94dfea5624c845  parts/part07.bin
          49a845aef5493401884dfdb17cf7f8807b45f3e6140fbc818971b26fa9d48879  parts/part08.bin
          EXPECTED
          cat parts/part{01,02,03,04,05,06,07,08}.bin > release/Starlight_Wild_Table_1.8.0.apk
          test "$(stat -c %s release/Starlight_Wild_Table_1.8.0.apk)" -eq 66185680
          echo 'd3300981bc4c57e9245593de001ee3276bd2266145bb8a464d8d56987ec07c11  release/Starlight_Wild_Table_1.8.0.apk' | sha256sum --check
          unzip -tqq release/Starlight_Wild_Table_1.8.0.apk
          jarsigner -verify release/Starlight_Wild_Table_1.8.0.apk
      - name: Publish original signed Wild Table APK to existing Family Store release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='harbolddavid-wq/nova-starfall-defense'
          tag='family-store-apks-2026-11-05'
          gh release view "$tag" -R "$repo" >/dev/null
          gh release upload "$tag" release/Starlight_Wild_Table_1.8.0.apk -R "$repo"
          gh release view "$tag" -R "$repo" --json assets --jq '.assets[] | select(.name == "Starlight_Wild_Table_1.8.0.apk") | {name,size,digest,url}'
