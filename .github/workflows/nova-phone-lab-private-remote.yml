name: Nova Phone Lab - Remote TLS Real Android Proof
on:
  push:
    branches:
      - experiment/nova-phone-lab-live-2026-11-01
    paths:
      - '.github/workflows/nova-phone-lab-private-remote.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-phone-lab-remote-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-android-external-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache synthetic fixture APK
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: lab-fixture/app/build/outputs/apk/debug/app-debug.apk
          key: nova-lab-button-apk-${{ hashFiles('lab-fixture/**') }}-v1
      - name: Build synthetic APK if missing
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: gradle --no-daemon -p lab-fixture :app:assembleDebug
      - name: Install relay dependencies and verify source
        run: |
          test -s lab-fixture/app/build/outputs/apk/debug/app-debug.apk
          python3 -m pip install --disable-pip-version-check -r tools/phone_lab_private/requirements.txt
          python3 -m compileall -q tools/phone_lab_private
      - name: Install official Cloudflare tunnel client
        run: |
          curl --fail --location --silent --show-error --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod 755 /tmp/cloudflared
          /tmp/cloudflared --version
          echo /tmp >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache clean Android 16 AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nova-phone-lab-avd-api36-googleapis-x64-v1
      - name: Create clean AVD snapshot if necessary
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo 'Prepared Android 16 AVD'
      - name: Real Android 16 via external HTTPS/WSS (temporary test-only tunnel)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install -r lab-fixture/app/build/outputs/apk/debug/app-debug.apk
            python3 tools/phone_lab_remote/remote_tls_smoke.py
      - name: Upload only non-sensitive test metadata, no images or tunnel URL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Phone-Lab-Remote-TLS-Proof-Metadata
          path: tools/phone_lab_remote/remote_tls_report.json
          if-no-files-found: ignore
          retention-days: 7