name: Build Starlight's Atlas standalone
on:
  push:
    branches: [atlas-standalone-a17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Unpack standalone source
        run: unzip -q atlas-standalone/source.zip -d atlas-standalone/source
      - name: Validate offline RP library
        working-directory: atlas-standalone/source/StarlightsAtlas
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/model.js
          node tests/model.cjs
          node tests/standalone.cjs
      - name: Compile unsigned release
        working-directory: atlas-standalone/source/StarlightsAtlas
        run: bash tools/build_unsigned.sh
      - name: Save APK and signing helper, never the private key
        uses: actions/upload-artifact@v4
        with:
          name: Starlights-Atlas-Standalone-Unsigned
          path: atlas-standalone/source/StarlightsAtlas/build-standalone/output/*
          retention-days: 7
          if-no-files-found: error
