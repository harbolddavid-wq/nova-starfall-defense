name: Starlight Theme Forge Pilot CI
permissions:
  contents: read
on:
  push:
    branches: ['experiment/starlight-theme-forge-pilot-20261030']
    paths: ['starlight-themes/**', '.github/workflows/starlight-forge-pilot-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Host regression and new catalog tests
        working-directory: starlight-themes
        run: |
          mkdir -p build/host
          javac -d build/host android/src/com/novasky/starlightthemes/ThemeCatalog.java android/src/com/novasky/starlightthemes/WorkspaceModel.java android/src/com/novasky/starlightthemes/IconClassifier.java android/src/com/novasky/starlightthemes/WidgetFinder.java tests/ThemeCatalogTest.java tests/WorkspaceModelTest.java tests/IconClassifierTest.java tests/WidgetFinderTest.java
          for c in ThemeCatalogTest WorkspaceModelTest IconClassifierTest WidgetFinderTest; do java -cp build/host "$c"; done
      - name: Build unsigned Android APK (private artwork and signing excluded)
        working-directory: starlight-themes
        run: |
          python3 scripts/build-android.py
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging output/starlight-unsigned.apk | head -n 6
          sha256sum output/starlight-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-theme-forge-0.5.1-unsigned
          path: starlight-themes/output/*
          retention-days: 7
  theme-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build launcher and synthetic widget fixture with temporary CI key
        run: python3 starlight-themes/tests/build-widget-fixture.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Apply and restore all five themes on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 starlight-themes/tests/theme-emulator-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starlight-theme-forge-emulator-evidence
          path: starlight-themes/build/theme-test-evidence/
          if-no-files-found: ignore
          retention-days: 7