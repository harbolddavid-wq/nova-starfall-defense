name: Starlight Themes preview build
on:
  push:
    branches: ['work/starlight-themes-desi-2026-10-29']
    paths: ['starlight-themes/**', '.github/workflows/starlight-themes.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
      - name: Exercise workspace model
        working-directory: starlight-themes
        run: |
          mkdir -p build/host
          javac -d build/host android/src/com/novasky/starlightthemes/WorkspaceModel.java tests/WorkspaceModelTest.java
          java -cp build/host WorkspaceModelTest
      - name: Build unsigned Android package
        working-directory: starlight-themes
        run: python3 scripts/build-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: Starlight-Themes-unsigned-preview
          path: starlight-themes/output/*
          retention-days: 7
