name: Starlight Themes preview build
permissions:
  contents: read
on:
  push:
    branches: ['work/starlight-themes-desi-2026-10-29']
    paths: ['starlight-themes/**', '.github/workflows/starlight-themes.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
      - name: Exercise workspace model
        working-directory: starlight-themes
        run: |
          mkdir -p build/host
          javac -d build/host android/src/com/novasky/starlightthemes/WorkspaceModel.java android/src/com/novasky/starlightthemes/IconClassifier.java tests/WorkspaceModelTest.java tests/IconClassifierTest.java
          java -cp build/host WorkspaceModelTest
          java -cp build/host IconClassifierTest
      - name: Build unsigned Android package
        working-directory: starlight-themes
        run: python3 scripts/build-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: Starlight-Themes-unsigned-preview
          path: starlight-themes/output/*
          retention-days: 7
  widget-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build launcher and synthetic widget provider
        run: python3 starlight-themes/tests/build-widget-fixture.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise widgets on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 starlight-themes/tests/widget-emulator-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Starlight-Widget-Test-Evidence
          path: starlight-themes/build/widget-test-evidence/
          if-no-files-found: ignore
          retention-days: 7
