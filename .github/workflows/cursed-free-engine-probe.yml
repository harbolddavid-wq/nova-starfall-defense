name: Test lighter free image editing API
on:
  push:
    branches: [work/cursed-engine-free-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gradio_client
      - name: Test lighter editor using public portrait
        run: |
          curl -fsSL https://raw.githubusercontent.com/googlesamples/mlkit/master/ios/quickstarts/vision/Resources/grace_hopper.jpg -o portrait.jpg
          python - <<'PY'
          from gradio_client import Client, handle_file
          import shutil
          c=Client('multimodalart/Qwen-Image-Edit-Fast',verbose=False)
          print(c.view_api(return_format='str'))
          out=c.predict(image=handle_file('portrait.jpg'),prompt='Transform this person into a realistic gothic vampire with visible pale skin, red eyes and sharp fangs, using cinematic photorealistic practical makeup. Preserve recognizable face, hair, clothing and background.',seed=0,randomize_seed=True,true_guidance_scale=1,num_inference_steps=8,rewrite_prompt=False,api_name='/infer')
          print('Result type:',type(out))
          shutil.copyfile(out[0],'vampire.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-vampire-probe
          path: vampire.png
