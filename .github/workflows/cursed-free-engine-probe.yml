name: Probe second free portrait editor
on:
  push:
    branches: [work/cursed-engine-free-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gradio_client
      - name: Edit public sample portrait
        run: |
          curl -fsSL https://raw.githubusercontent.com/googlesamples/mlkit/master/ios/quickstarts/vision/Resources/grace_hopper.jpg -o portrait.jpg
          python - <<'PY'
          from gradio_client import Client
          import base64, json
          c=Client('prithivMLmods/Qwen-Image-Edit-2511-LoRAs-Fast',verbose=False)
          print(c.view_api(return_format='str'))
          image='data:image/jpeg;base64,'+base64.b64encode(open('portrait.jpg','rb').read()).decode()
          prompt='Transform this person into a realistic gothic vampire with pale skin, red eyes and visible sharp fangs, using cinematic photorealistic practical makeup. Preserve the recognizable face, hair, clothing and background.'
          r=c.predict(images_b64_json=json.dumps([image]),prompt=prompt,lora_adapter='Hyper-Realistic-Portrait',seed=42,randomize_seed=True,guidance_scale=1.0,steps=4,api_name='/edit_image')
          print('response status:',r.get('status'))
          if r.get('status')!='success': raise RuntimeError(str(r))
          open('vampire.png','wb').write(base64.b64decode(r['image'].split(',',1)[-1]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-vampire-second-probe
          path: vampire.png
