name: Publish Holodeck worlds — no APK build
on:
  push:
    branches: [work/pocket-holodeck]
    paths:
      - 'experiences/**'
      - 'tools/publish_worlds.py'
      - 'tools/CatalogSigner.java'
      - '.github/workflows/publish-holodeck-worlds.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holodeck-world-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[host]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore original trusted publisher signer
        id: signer
        uses: actions/cache/restore@v4
        with:
          path: .signing/candidate.keystore
          key: pocket-holodeck-candidate-signer-v2
          fail-on-cache-miss: true
      - name: Publish versioned world packages and signed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_worlds.py --upload
