name: Publish Holodeck worlds — no APK build
on:
  push:
    branches: [work/pocket-holodeck]
    paths:
      - 'experiences/**'
      - 'tools/publish_worlds.py'
      - 'tools/CatalogSigner.java'
      - '.github/workflows/publish-holodeck-worlds.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holodeck-world-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[host]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore original trusted publisher signer
        id: signer
        uses: actions/cache/restore@v4
        with:
          path: .signing/candidate.keystore
          key: pocket-holodeck-candidate-signer-v2
          fail-on-cache-miss: true
      - name: Play downloadable experience before publishing
        run: |
          mkdir -p evidence
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8766 --directory experiences/lanternwake > /tmp/lanternwake-http.log 2>&1 &
          node tools/lanternwake-test.cjs
      - name: Save world playthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Publish-Playthrough
          path: evidence/
          retention-days: 14
      - name: Publish versioned world packages and signed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_worlds.py --upload
