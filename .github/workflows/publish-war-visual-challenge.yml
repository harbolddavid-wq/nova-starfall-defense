name: Publish WAR Visual Challenge v0.1.0 to Family Store
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-war-visual-challenge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'harbolddavid-wq/nova-starfall-defense'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify David-approved original WAR APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          import urllib.request
          uri = 'https://nova-family-store.hatchable.site/api/war-transfer'
          req = urllib.request.Request(uri, headers={'User-Agent': 'Nova-Family-Store-Publisher/1.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = response.read()
          if len(data) != 830439:
              raise SystemExit(f'WAR APK size mismatch: {len(data)}')
          with open('release/WAR_The_Visual_Challenge_v0.1.0.apk', 'wb') as fp:
              fp.write(data)
          PY
          echo '0cb5e08cc0e97f6a5e18daf5325c5f5bb468a11438b52313e38d5424e0f3d1b6  release/WAR_The_Visual_Challenge_v0.1.0.apk' | sha256sum --check
          unzip -tqq release/WAR_The_Visual_Challenge_v0.1.0.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          signer="$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          test -n "$signer"
          "$signer" verify --verbose release/WAR_The_Visual_Challenge_v0.1.0.apk
      - name: Publish unchanged WAR APK to existing Family Store GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='harbolddavid-wq/nova-starfall-defense'
          tag='family-store-apks-2026-11-05'
          gh release view "$tag" -R "$repo" >/dev/null
          gh release upload "$tag" release/WAR_The_Visual_Challenge_v0.1.0.apk -R "$repo"
          gh release view "$tag" -R "$repo" --json assets --jq '.assets[] | select(.name == "WAR_The_Visual_Challenge_v0.1.0.apk") | {name,size,digest,url}'
