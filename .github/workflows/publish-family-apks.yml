name: Publish Family Store APK downloads
on:
  push:
    branches: [main]
    paths:
      - 'family-store-apks/**'
      - '.github/workflows/publish-family-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'harbolddavid-wq/nova-starfall-defense'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify original signed APKs
        run: |
          cd family-store-apks
          sha256sum -c SHA256SUMS
      - name: Publish independently downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=family-store-apks-2026-11-05
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Nova Family Store APK Downloads" --notes "Verified original signed family APKs. Downloads served by GitHub Releases without using storefront bandwidth."
          fi
          for apk in family-store-apks/*.apk; do
            [ -f "$apk" ] || continue
            gh release upload "$TAG" "$apk" --clobber
          done
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, files: [.assets[].name]}'
