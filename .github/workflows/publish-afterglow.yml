name: Publish verified Afterglow APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-afterglow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'harbolddavid-wq/nova-starfall-defense'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out recovered APK chunks
        uses: actions/checkout@v4
        with:
          ref: publish/afterglow-0.1.0-chunks
          persist-credentials: false

      - name: Reassemble and verify original Afterglow APK
        shell: bash
        run: |
          set -euo pipefail
          dir=family-store-apks/chunks/afterglow
          test "$(find "$dir" -maxdepth 1 -type f -name 'part*.bin' | wc -l)" -eq 66
          jq -e '.total_chunks == 66 and (.parts | length) == 66 and .source_size == 48493787 and .source_sha256 == "5e7aa3beb2d0997afd1ea124670d1888e3563d4e59060acfbf4fd77437c9bd7a"' "$dir/UPLOAD_PROGRESS.json"
          for i in $(seq -w 0 65); do
            test -s "$dir/part$(printf '%03d' "$((10#$i))").bin"
          done
          mkdir -p release
          cat "$dir"/part???.bin > release/Nova_Afterglow_0.1.0_Media_TEST.apk
          printf '%s  %s\n' '5e7aa3beb2d0997afd1ea124670d1888e3563d4e59060acfbf4fd77437c9bd7a' 'release/Nova_Afterglow_0.1.0_Media_TEST.apk' | sha256sum --check
          test "$(wc -c < release/Nova_Afterglow_0.1.0_Media_TEST.apk)" -eq 48493787
          unzip -tqq release/Nova_Afterglow_0.1.0_Media_TEST.apk
          echo 'Original APK passes size, SHA-256 and ZIP integrity validation.'

      - name: Publish APK to existing public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=family-store-apks-2026-11-05
          gh release view "$tag" >/dev/null
          gh release upload "$tag" release/Nova_Afterglow_0.1.0_Media_TEST.apk --clobber
          gh release view "$tag" --json assets --jq '.assets[] | select(.name == "Nova_Afterglow_0.1.0_Media_TEST.apk") | {name, size, url}'
