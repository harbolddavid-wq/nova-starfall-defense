name: Nova Lockscapes Android
on:
  push:
    branches: [nova-lockscapes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore native project
        run: |
          cat lockscapes-payload/chunk-*.txt | tr -d '\n\r' | base64 -d > nova-lockscapes-source.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('nova-lockscapes-source.zip') as z:
              assert z.testzip() is None
              z.extractall('nova-lockscapes')
          PY
          test -f nova-lockscapes/app/src/main/java/com/nova/lockscapes/MainActivity.java
      - name: Build
        working-directory: nova-lockscapes
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Preserve signing identity
        if: success()
        run: |
          mkdir -p key-backup
          cp "$HOME/.android/debug.keystore" key-backup/lockscapes.keystore
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Lockscapes-APK
          path: nova-lockscapes/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signing key (keep private for upgrades)
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Lockscapes-Personal-Key
          path: key-backup/lockscapes.keystore
          if-no-files-found: error
          retention-days: 60
