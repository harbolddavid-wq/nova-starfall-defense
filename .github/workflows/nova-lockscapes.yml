name: Nova Lockscapes Android
on:
  push:
    branches: [nova-lockscapes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore native project
        run: |
          cat lockscapes-payload/chunk-*.txt | tr -d '\n\r' | base64 -d > nova-lockscapes-source.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('nova-lockscapes-source.zip') as z:
              assert z.testzip() is None
              z.extractall('nova-lockscapes')
          PY
          test -f nova-lockscapes/app/src/main/java/com/nova/lockscapes/MainActivity.java
      - name: Build unsigned native release
        working-directory: nova-lockscapes
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Package unsigned APK and official Android signer
        run: |
          mkdir -p export
          cp nova-lockscapes/app/build/outputs/apk/release/app-release-unsigned.apk export/lockscapes-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export/apksigner.jar
          ls -lh export/
      - name: Upload unsigned build for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Lockscapes-Unsigned-and-Signer
          path: export/*
          if-no-files-found: error
