name: Starlight Icons Android APK
on:
  push:
    branches: [starlight-icons]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starlight-icons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Starlight-Icons-APK
          path: starlight-icons/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error