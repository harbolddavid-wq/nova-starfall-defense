name: Pocket Holodeck — build, playtest, release
on:
  push:
    branches: [work/pocket-holodeck]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pocket-holodeck
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore this candidate's update signer
        id: signer
        uses: actions/cache/restore@v4
        with:
          path: .signing/candidate.keystore
          key: pocket-holodeck-candidate-signer-v2
      - name: Guard signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_HIT: ${{ steps.signer.outputs.cache-hit }}
        run: |
          if gh release view holodeck-v0.1.0 >/dev/null 2>&1 && [ "$CACHE_HIT" != 'true' ]; then
            echo 'Existing APK found but original candidate signer unavailable; refusing a mismatched update.'
            exit 1
          fi
      - name: Create isolated candidate signer on first build
        run: |
          mkdir -p .signing
          if [ ! -f .signing/candidate.keystore ]; then
            keytool -genkeypair -keystore .signing/candidate.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Nova Pocket Holodeck Test,O=Nova,C=US'
          fi
          test -s .signing/candidate.keystore
      - name: Browser playthrough and sound engine
        run: |
          mkdir -p evidence
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory app/src/main/assets/starwell > /tmp/holodeck-http.log 2>&1 &
          node tools/browser-test.cjs
      - name: Build host and device tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Preserve candidate signer
        if: steps.signer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing/candidate.keystore
          key: pocket-holodeck-candidate-signer-v2
      - name: Save compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Pocket-Holodeck-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Playtest on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/device-test.sh
      - name: Save device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Holodeck-Android16-Evidence
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Publish verified install candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Nova_Pocket_Holodeck_v0.1.2.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/*.apk
          gh release view holodeck-v0.1.2 >/dev/null 2>&1 || gh release create holodeck-v0.1.2 --target "$GITHUB_SHA" --title 'Nova Pocket Holodeck 0.1.2' --notes 'Remove the continuous background hum. Entrance chimes and touch sounds retained. No active audio tracks while idle; Android 16 tests passed. Same app, signer and saved sky.'
          zip -qr release/Holodeck_Test_Evidence.zip evidence
          gh release upload holodeck-v0.1.2 release/* --clobber
