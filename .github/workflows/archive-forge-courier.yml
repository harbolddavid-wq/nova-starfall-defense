name: Nova Archive Forge dependency courier
permissions:
  contents: read
on:
  push:
    branches: ['experiment/nova-archive-forge-20261030']
    paths: ['.github/workflows/archive-forge-courier.yml']
  workflow_dispatch:
jobs:
  fetch-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve declared runtime dependencies from Maven Central
        shell: bash
        run: |
          cat > pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion><groupId>com.novasky</groupId><artifactId>archive-forge-courier</artifactId><version>0.1.1</version>
          <dependencies>
            <dependency><groupId>org.apache.commons</groupId><artifactId>commons-compress</artifactId><version>1.27.1</version></dependency>
            <dependency><groupId>org.tukaani</groupId><artifactId>xz</artifactId><version>1.10</version></dependency>
            <dependency><groupId>com.github.junrar</groupId><artifactId>junrar</artifactId><version>7.5.5</version></dependency>
          </dependencies>
          </project>
          XML
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.7.1:copy-dependencies -DoutputDirectory=deps -DincludeScope=runtime -DexcludeTransitive=false
          find deps -type f -printf '%f %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: nova-archive-forge-runtime-jars
          path: deps/*.jar
          retention-days: 7
