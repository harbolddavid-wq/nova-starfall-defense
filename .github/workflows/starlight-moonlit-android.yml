name: Starlight Collector Moonlit Studio Android smoke test
on:
  push:
    branches: [work/starlight-moonlit-android-2026-11-21]
    paths: ['.github/workflows/starlight-moonlit-android.yml']
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Download and verify the signed APK
        run: |
          curl --fail --silent --show-error --location --max-time 90 'https://hatchable.com/s/eyJwIjoxMjc3OTIsImsiOiJzdGFybGlnaHRcL2Rvd25sb2Fkc1wvU3RhcmxpZ2h0LUNvbGxlY3Rvci0wLjUuMC1Nb29ubGl0LVN0dWRpby5hcGsifQ.b1ce7bb7d6539907e16baa3b7aca0249b21d8cbc277c82073a8c41a22893afd3' -o starlight-release.apk
          printf '%s  %s\n' '7520a96244b16fd4ca85ade75cb06fa600ac7893c169d1c340d365998632675c' starlight-release.apk | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot verification dependency
        run: python3 -m pip install --quiet pillow
      - name: Prepare smoke-test script
        run: |
          cat > smoke.sh <<'SH'
          set -euo pipefail
          package=family.nova.starlightcollector.studio
          adb shell wm size 540x1200
          adb shell wm density 200
          adb install starlight-release.apk
          adb shell dumpsys package "$package" | grep 'versionName=0.5.0'
          adb logcat -c
          adb shell am start -W -n "$package/.StudioActivity"
          sleep 4
          adb shell dumpsys activity activities | grep -m1 'topResumedActivity=.*StudioActivity'
          mkdir -p evidence
          capture(){ timeout 14 adb exec-out screencap -p > "evidence/$1.png"; }
          capture room
          read -r w h < <(python3 -c 'import struct; print(*struct.unpack(">II",open("evidence/room.png","rb").read(24)[16:24]))')
          test "$w" -gt "$h"
          tap(){ timeout 12 adb shell input tap "$(($1*w/1280))" "$(($2*h/576))"; }
          tap 694 455
          sleep 2
          tap 1212 503
          sleep 2
          capture held
          tap 1125 503
          sleep 2
          capture inspect
          tap 1203 42
          tap 950 180
          sleep 1
          tap 1212 503
          sleep 5
          capture shelved
          tap 982 39
          sleep 2
          capture album
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          def load(name):
              return Image.open('evidence/'+name+'.png').convert('RGB').resize((640,288))
          def change(a,b,box):
              return sum(ImageStat.Stat(ImageChops.difference(load(a).crop(box),load(b).crop(box))).mean)/3
          room=load('room')
          def colorful(shot):
              return len(set(shot.crop((100,40,530,250)).getdata()))
          assert colorful(room)>1200,'Room was blank'
          assert change('room','held',(295,68,383,235))>7,'Character did not approach Xav'
          assert change('held','inspect',(115,70,545,228))>15,'Examine panel did not appear'
          assert change('room','shelved',(459,73,490,104))>7,'Xav did not reach the shelf'
          assert change('shelved','album',(115,70,545,228))>15,'Album did not open'
          print('Verified Android render: room, walk-up pickup, inspect, shelf placement, album')
          PY
          adb logcat -d -b crash > evidence/crash.log
          test ! -s evidence/crash.log
          echo "ANDROID_SMOKE_PASS"
          SH
      - name: Android 16 install, launch, pickup and shelving
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2560M
          emulator-boot-timeout: 540
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: bash smoke.sh
      - name: Retain Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-Moonlit-Android16
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3
