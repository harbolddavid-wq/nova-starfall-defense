name: Starlight Collector Moonbound Book 0.7.1 Android smoke test
on:
  push:
    branches: [work/starlight-moonlit-android-2026-11-21]
    paths: ['.github/workflows/starlight-moonlit-android.yml']
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Download and verify the signed APK
        run: |
          curl --fail --silent --show-error --location --max-time 90 'https://hatchable.com/s/eyJwIjoxMjc3OTIsImsiOiJzdGFybGlnaHRcL2Rvd25sb2Fkc1wvMWY4MWM2MzFcL1N0YXJsaWdodC1Db2xsZWN0b3ItMC43LjEtTW9vbmJvdW5kLUJvb2suYXBrIn0.182a6c4e9a42f8f79572730672dd90bb15fd063db6e4c89f5b1f01f86f347d5e' -o starlight-release.apk
          printf '%s  %s\n' '1f81c631df58c334d81483fa1a59de44ae2ed16fc3f15e127343b25907f30931' starlight-release.apk | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot verification dependency
        run: python3 -m pip install --quiet pillow
      - name: Prepare smoke-test script
        run: |
          cat > smoke.sh <<'SH'
          set -euxo pipefail
          package=family.nova.starlightcollector.studio
          adb shell wm size 540x1200
          adb shell wm density 200
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb install starlight-release.apk
          adb shell dumpsys package "$package" | grep 'versionName=0.7.1'
          adb logcat -c
          adb shell am start -W -n "$package/.StudioActivity"
          sleep 8
          adb shell dumpsys activity activities | grep -m1 'topResumedActivity=.*StudioActivity'
          mkdir -p evidence
          trap 'timeout 8 adb logcat -d -s MoonlitStudio chromium > evidence/webview.log || true' EXIT
          capture(){ timeout 14 adb exec-out screencap -p > "evidence/$1.png"; }
          capture room
          read -r w h < <(python3 -c 'import struct; print(*struct.unpack(">II",open("evidence/room.png","rb").read(24)[16:24]))')
          test "$w" -gt "$h"
          tap(){ timeout 12 adb shell input tap "$(($1*w/1280))" "$(($2*h/576))"; }
          tap 694 455
          sleep 5
          tap 1212 503
          sleep 5
          capture held
          tap 1125 503
          sleep 5
          capture inspect
          tap 1203 42
          tap 950 180
          sleep 1
          tap 1212 503
          sleep 7
          capture shelved
          tap 950 174
          tap 1212 503
          sleep 5
          capture held-again
          tap 1051 503
          sleep 1
          tap 1212 503
          sleep 6
          capture low-shelf
          tap 228 236
          tap 1125 503
          sleep 4
          capture book
          tap 1203 42
          tap 886 39
          sleep 4
          capture rooms
          tap 190 375
          sleep 6
          capture tide
          tap 300 427
          tap 1212 503
          sleep 5
          capture tide-carry
          adb shell input swipe "$((117*w/1280))" "$((458*h/576))" "$((189*w/1280))" "$((428*h/576))" 900
          sleep 1
          capture tide-turn
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          def load(name):
              return Image.open('evidence/'+name+'.png').convert('RGB').resize((640,288))
          def change(a,b,box):
              return sum(ImageStat.Stat(ImageChops.difference(load(a).crop(box),load(b).crop(box))).mean)/3
          room=load('room')
          def colorful(shot):
              return len(set(shot.crop((100,40,530,250)).getdata()))
          assert colorful(room)>1200,'Room was blank'
          assert change('room','held',(295,68,383,235))>7,'Character did not approach Xav'
          assert change('held','inspect',(115,70,545,228))>15,'Examine panel did not appear'
          assert change('room','shelved',(459,73,490,104))>7,'Xav did not reach the shelf'
          assert change('shelved','low-shelf',(455,115,497,142))>6,'Crouch and Place did not reach the lower shelf'
          assert change('low-shelf','book',(105,65,550,245))>15,'Tabletop sticker book did not open'
          assert change('shelved','rooms',(115,70,545,228))>15,'Room map did not open'
          assert colorful(load('tide'))>1200 and change('room','tide',(115,70,545,228))>15,'Tide Gallery did not render'
          assert change('tide','tide-carry',(108,137,174,238))>5,'Tide pickup did not approach the plush'
          assert change('tide-carry','tide-turn',(120,137,265,240))>3,'Joystick did not move during Tide carry'
          print('Verified Android render: room, walk-up pickup, inspect, upper shelf, crouch placement, tabletop book, room map and a joystick turn while carrying in Tide Gallery')
          PY
          adb logcat -d -b crash > evidence/crash.log
          test ! -s evidence/crash.log
          echo "ANDROID_SMOKE_PASS"
          SH
      - name: Android 16 install, launch, pickup and shelving
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2560M
          emulator-boot-timeout: 540
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: bash smoke.sh
      - name: Retain Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-Moonlit-Android16
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3
