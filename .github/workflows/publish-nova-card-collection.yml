name: Publish Nova Card Collection v0.2.2 to Family Store
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nova-card-collection.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'harbolddavid-wq/nova-starfall-defense'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve and verify the unchanged signed card game APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          import urllib.request
          url='https://nova-family-store.hatchable.site/api/nova-cards-transfer'
          request=urllib.request.Request(url,headers={'User-Agent':'Nova-Family-Store-Publisher/1.0'})
          with urllib.request.urlopen(request,timeout=60) as response:
              data=response.read()
          if len(data)!=149738:
              raise SystemExit(f'APK size mismatch: {len(data)}')
          with open('release/Nova_Card_Collection_v0.2.2.apk','wb') as out:
              out.write(data)
          PY
          echo '425fbd7a2935fe6d051e59bbdd011886ab3efcc4db54322b6c98fc4f63a4220a  release/Nova_Card_Collection_v0.2.2.apk' | sha256sum --check
          unzip -tqq release/Nova_Card_Collection_v0.2.2.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          signer="$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          test -n "$signer"
          "$signer" verify --verbose release/Nova_Card_Collection_v0.2.2.apk
      - name: Upload unchanged APK to existing GitHub Family Store release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='harbolddavid-wq/nova-starfall-defense'
          tag='family-store-apks-2026-11-05'
          gh release view "$tag" -R "$repo" >/dev/null
          gh release upload "$tag" release/Nova_Card_Collection_v0.2.2.apk -R "$repo"
          gh release view "$tag" -R "$repo" --json assets --jq '.assets[] | select(.name == "Nova_Card_Collection_v0.2.2.apk") | {name,size,digest,url}'
