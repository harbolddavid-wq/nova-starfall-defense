name: Nova Phone Lab - Private Synthetic Checkpoint
on:
  workflow_dispatch:
  push:
    branches: [experiment/nova-phone-lab-live-2026-11-01]
    paths: ['tools/phone_lab_mcp/private_checkpoint_trigger.txt']
permissions:
  contents: read
jobs:
  private-save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require configured private checkpoint credentials
        env:
          PHONE_LAB_BACKUP_TOKEN: ${{ secrets.PHONE_LAB_BACKUP_TOKEN }}
          PHONE_LAB_CHECKPOINT_KEY: ${{ secrets.PHONE_LAB_CHECKPOINT_KEY }}
        run: |
          test -n "$PHONE_LAB_BACKUP_TOKEN"
          python3 -c 'import os,re,sys; s=os.environ["PHONE_LAB_BACKUP_TOKEN"]; valid=bool(re.fullmatch(r"github_pat_[A-Za-z0-9_]+",s)); print("Token has expected fine-grained format:",valid); sys.exit(0 if valid else 1)'
          test -n "$PHONE_LAB_CHECKPOINT_KEY"
          python3 -c 'import os,re,sys; s=os.environ["PHONE_LAB_CHECKPOINT_KEY"].strip(); print("Key characters:",len(s)); print("Key has internal whitespace:",bool(re.search(r"\s",s))); print("Key begins with URL:",s.startswith(("https://","http://"))); print("Key has only base64 characters:",bool(re.fullmatch(r"[A-Za-z0-9+/=]+",s))); sys.exit(0 if re.fullmatch(r"[A-Za-z0-9+/]{43}=",s) else 1)'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build public synthetic test fixture
        run: gradle --no-daemon -p lab-fixture :app:assembleDebug
      - name: Install cryptography
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set synthetic counter to 2 and save encrypted
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHONE_LAB_BACKUP_TOKEN: ${{ secrets.PHONE_LAB_BACKUP_TOKEN }}
          PHONE_LAB_CHECKPOINT_KEY: ${{ secrets.PHONE_LAB_CHECKPOINT_KEY }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install lab-fixture/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.novasky.phonelab.fixture/.MainActivity
            sleep 3
            adb shell input tap 350 430
            sleep 1
            adb shell input tap 350 430
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 2'
            python3 tools/phone_lab_mcp/synthetic_private_checkpoint.py save lab-fixture/app/build/outputs/apk/debug/app-debug.apk
      - name: Transfer synthetic APK only
        uses: actions/upload-artifact@v4
        with:
          name: nova-public-synthetic-apk-${{ github.run_id }}
          path: lab-fixture/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
  private-restore:
    needs: private-save
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Install cryptography
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: nova-public-synthetic-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/nova-fixture
      - name: Restore encrypted counter on a fresh runner
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHONE_LAB_BACKUP_TOKEN: ${{ secrets.PHONE_LAB_BACKUP_TOKEN }}
          PHONE_LAB_CHECKPOINT_KEY: ${{ secrets.PHONE_LAB_CHECKPOINT_KEY }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 260
            adb install "$RUNNER_TEMP/nova-fixture/app-debug.apk"
            python3 tools/phone_lab_mcp/synthetic_private_checkpoint.py restore "$RUNNER_TEMP/nova-fixture/app-debug.apk"
            adb shell am start -n com.novasky.phonelab.fixture/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 2'
            adb shell input tap 350 430
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml
            adb exec-out cat /sdcard/window.xml | grep -q 'BUTTON PRESSES: 3'
            echo 'PASS encrypted synthetic counter restored and advanced on a fresh runner.'
