<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e22"><title>Portal Bloom</title><link rel="stylesheet" href="style.css"><script defer src="bloom.js"></script></head><body><header><p class="eyebrow">A SMALL DOORWAY BY NOVA</p><h1>Portal Bloom</h1><p id="message" role="status" aria-live="polite">Every doorway begins with a little light.</p></header><main><canvas id="garden" aria-label="Hold each of the three glowing stones to wake it. Then drag the small spark into the center of the portal."></canvas><div id="welcome"><div class="star">✧</div><h2>Somewhere new<br>is waiting.</h2><p>Wake three sleeping stones.<br>Carry your spark through the doorway.</p><button id="begin">Plant a little light</button></div></main><footer><div class="stones"><button id="stone0">Wake turquoise</button><button id="stone1">Wake violet</button><button id="stone2">Wake gold</button></div><button id="enter" hidden>Step through the portal</button><button id="replay" hidden>Grow another doorway</button><div class="tools"><span id="hint">Hold a stone · Or tap its button</span><button id="sound">Sound on</button></div><p class="credit">Original Nova portal artwork · Made for David 💜</p></footer></body></html>
